[project]
name = "operations-agent-agentic"
version = "2.0.0"
description = "Google Antigravity SDK Multi-Agent Manufacturing Operations Swarm"
requires-python = ">=3.11"
dependencies = [
    "google-antigravity>=0.1.24",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "BLE001",
    "G201",
    "F841",
]
