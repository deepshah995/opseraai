[project]
name = "operations-agent-backend"
version = "1.0.0"
description = "AI Operations Exception Agent Backend Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "F821",   # forward references in SQLAlchemy relationship annotations
    "BLE001", # intentional blind exception catch in adapter fallbacks
    "G201",   # logger.error with exc_info=True
    "SIM102", # nested if readability
    "B008",   # FastAPI Depends() and Query() in function argument defaults
    "F841",   # unused variable
]
