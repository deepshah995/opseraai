name: CI/CD - Parallel Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'business-agents-508202' }}
  DOCKER_USER: ${{ secrets.DOCKER_USER || secrets.DOCKERHUB_USERNAME || 'deepshah995' }}

jobs:
  # ==========================================
  # STAGE 1: Fast Quality & Test Checks
  # ==========================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./backend
          pip install -e ./agentic
          pip install pytest pytest-asyncio ruff email-validator

      - name: Run Ruff Linting
        run: |
          ruff check backend/ agentic/

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest -v backend/tests/

  frontend-check:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js
        working-directory: ./frontend
        run: npm run build

  # ==========================================
  # STAGE 2: PARALLEL SERVICE BUILDS & DEPLOYS
  # Each service builds & deploys concurrently
  # ==========================================

  # --- 1. OPSERA BACKEND SERVICE ---
  service-backend:
    name: Backend: Build & Deploy
    needs: [backend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKER_USER }}/opsera-backend:${{ github.sha }}
            ${{ env.DOCKER_USER }}/opsera-backend:latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GOOGLE_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy opsera-backend to Cloud Run
        run: |
          gcloud run deploy opsera-backend \
            --project ${{ env.PROJECT_ID }} \
            --image docker.io/${{ env.DOCKER_USER }}/opsera-backend:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8000 \
            --set-env-vars "ENVIRONMENT=production,DATABASE_URL=sqlite:////app/data/ops_agent.db,USE_MOCK_LLM_IN_DEV=true,STORAGE_BACKEND=local,LOCAL_STORAGE_DIR=/app/data/storage" \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2

  # --- 2. OPSERA AGENTIC WORKER SERVICE ---
  service-agentic:
    name: Agentic Worker: Build & Deploy
    needs: [backend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Build & Push Agentic Worker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./agentic/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKER_USER }}/opsera-agentic:${{ github.sha }}
            ${{ env.DOCKER_USER }}/opsera-agentic:latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GOOGLE_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy opsera-agentic to Cloud Run
        run: |
          gcloud run deploy opsera-agentic \
            --project ${{ env.PROJECT_ID }} \
            --image docker.io/${{ env.DOCKER_USER }}/opsera-agentic:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "ENVIRONMENT=production,USE_MOCK_LLM_IN_DEV=true" \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2

  # --- 3. OPSERA FRONTEND SERVICE ---
  service-frontend:
    name: Frontend: Build & Deploy
    needs: [frontend-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKER_USER }}/opsera-frontend:${{ github.sha }}
            ${{ env.DOCKER_USER }}/opsera-frontend:latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GOOGLE_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Discover Backend URL & Deploy opsera-frontend
        run: |
          # Retrieve backend URL (polling briefly if first deployment is in progress)
          BACKEND_URL=""
          for i in {1..20}; do
            BACKEND_URL=$(gcloud run services describe opsera-backend --project ${{ env.PROJECT_ID }} --platform managed --region ${{ env.REGION }} --format 'value(status.url)' 2>/dev/null || true)
            if [ -n "$BACKEND_URL" ]; then
              echo "Discovered Backend URL: $BACKEND_URL"
              break
            fi
            echo "Waiting for opsera-backend endpoint to resolve... ($i/20)"
            sleep 5
          done

          gcloud run deploy opsera-frontend \
            --project ${{ env.PROJECT_ID }} \
            --image docker.io/${{ env.DOCKER_USER }}/opsera-frontend:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "NODE_ENV=production,BACKEND_API_URL=${BACKEND_URL}" \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2

  # ==========================================
  # STAGE 3: Final Deployment Summary
  # ==========================================
  deployment-summary:
    name: Deployment Summary
    needs: [service-backend, service-agentic, service-frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GOOGLE_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Publish Summary Table
        run: |
          FRONTEND_URL=$(gcloud run services describe opsera-frontend --project ${{ env.PROJECT_ID }} --platform managed --region ${{ env.REGION }} --format 'value(status.url)' 2>/dev/null || echo "Pending")
          BACKEND_URL=$(gcloud run services describe opsera-backend --project ${{ env.PROJECT_ID }} --platform managed --region ${{ env.REGION }} --format 'value(status.url)' 2>/dev/null || echo "Pending")
          AGENTIC_URL=$(gcloud run services describe opsera-agentic --project ${{ env.PROJECT_ID }} --platform managed --region ${{ env.REGION }} --format 'value(status.url)' 2>/dev/null || echo "Pending")

          echo "### 🚀 Cloud Run Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Cloud Run Endpoint | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend UI** | [$FRONTEND_URL]($FRONTEND_URL) | Active |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend API** | [$BACKEND_URL]($BACKEND_URL) | Active |" >> $GITHUB_STEP_SUMMARY
          echo "| **Agentic Worker** | [$AGENTIC_URL]($AGENTIC_URL) | Active |" >> $GITHUB_STEP_SUMMARY
