name: CI/CD - Test, Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'business-agents-508202' }}
  DOCKER_USER: ${{ secrets.DOCKER_USER || secrets.DOCKERHUB_USERNAME || 'deepshah995' }}

jobs:
  # ==========================================
  # STAGE 1: Automated Quality & Test Suite
  # ==========================================
  backend-tests:
    name: Backend & Agentic Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./backend
          pip install -e ./agentic
          pip install pytest pytest-asyncio ruff

      - name: Run Ruff Linting
        run: |
          ruff check backend/ agentic/

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest -v backend/tests/

  frontend-check:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js
        working-directory: ./frontend
        run: npm run build

  # ==========================================
  # STAGE 2: Parallel Docker Image Builds
  # ==========================================
  build-images:
    name: Build & Push ${{ matrix.service.name }}
    needs: [backend-tests, frontend-check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: opsera-backend
            context: .
            dockerfile: ./backend/Dockerfile
          - name: opsera-agentic
            context: .
            dockerfile: ./agentic/Dockerfile
          - name: opsera-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Build & Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKER_USER }}/${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.DOCKER_USER }}/${{ matrix.service.name }}:latest

  # ==========================================
  # STAGE 3: Cloud Run Deployment
  # ==========================================
  deploy-cloudrun:
    name: Deploy Services to Cloud Run
    needs: [build-images]
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GOOGLE_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy opsera-backend \
            --project ${{ env.PROJECT_ID }} \
            --image docker.io/${{ env.DOCKER_USER }}/opsera-backend:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8000 \
            --set-env-vars "ENVIRONMENT=production,DATABASE_URL=sqlite:////app/data/ops_agent.db,USE_MOCK_LLM_IN_DEV=true,STORAGE_BACKEND=local,LOCAL_STORAGE_DIR=/app/data/storage" \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2

      - name: Retrieve Backend URL
        run: |
          BACKEND_URL=$(gcloud run services describe opsera-backend --project ${{ env.PROJECT_ID }} --platform managed --region ${{ env.REGION }} --format 'value(status.url)')
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV
          echo "Discovered Backend URL: $BACKEND_URL"

      - name: Deploy Agentic Worker to Cloud Run
        run: |
          gcloud run deploy opsera-agentic \
            --project ${{ env.PROJECT_ID }} \
            --image docker.io/${{ env.DOCKER_USER }}/opsera-agentic:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "ENVIRONMENT=production,USE_MOCK_LLM_IN_DEV=true" \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2

      - name: Retrieve Agentic Worker URL
        run: |
          AGENTIC_URL=$(gcloud run services describe opsera-agentic --project ${{ env.PROJECT_ID }} --platform managed --region ${{ env.REGION }} --format 'value(status.url)')
          echo "AGENTIC_URL=$AGENTIC_URL" >> $GITHUB_ENV
          echo "Discovered Agentic URL: $AGENTIC_URL"

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy opsera-frontend \
            --project ${{ env.PROJECT_ID }} \
            --image docker.io/${{ env.DOCKER_USER }}/opsera-frontend:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "NODE_ENV=production,BACKEND_API_URL=${{ env.BACKEND_URL }}" \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2

      - name: Retrieve Frontend URL
        run: |
          FRONTEND_URL=$(gcloud run services describe opsera-frontend --project ${{ env.PROJECT_ID }} --platform managed --region ${{ env.REGION }} --format 'value(status.url)')
          echo "FRONTEND_URL=$FRONTEND_URL" >> $GITHUB_ENV
          echo "Discovered Frontend URL: $FRONTEND_URL"

      - name: Deployment Summary
        run: |
          echo "### 🚀 Cloud Run Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Cloud Run Endpoint | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend** | [${{ env.FRONTEND_URL }}](${{ env.FRONTEND_URL }}) | Next.js 14 Web Interface |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend** | [${{ env.BACKEND_URL }}](${{ env.BACKEND_URL }}) | FastAPI Core + SQLite Database |" >> $GITHUB_STEP_SUMMARY
          echo "| **Agentic Worker** | [${{ env.AGENTIC_URL }}](${{ env.AGENTIC_URL }}) | LangGraph Investigation Worker |" >> $GITHUB_STEP_SUMMARY
