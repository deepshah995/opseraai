name: CI/CD - Fast Parallel Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'business-agents-508202' }}
  DOCKER_USER: ${{ secrets.DOCKER_USER || secrets.DOCKERHUB_USERNAME || 'deepshah995' }}

jobs:
  # ==========================================
  # STAGE 1: Fast Backend Test Suite (< 20s)
  # ==========================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/pyproject.toml
            agentic/pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ./backend -e ./agentic pytest pytest-asyncio ruff email-validator

      - name: Run Ruff Linting
        run: |
          ruff check backend/ agentic/

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest -q backend/tests/

  # ==========================================
  # STAGE 2: PARALLEL SERVICE BUILDS & DEPLOYS
  # All 3 services build and deploy concurrently
  # ==========================================

  # --- 1. OPSERA BACKEND SERVICE ---
  service-backend:
    name: "Backend: Build & Deploy"
    needs: [backend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_USER }}/opsera-backend:${{ github.sha }}
            ${{ env.DOCKER_USER }}/opsera-backend:latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GOOGLE_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy opsera-backend to Cloud Run
        run: |
          sleep 10
          for attempt in 1 2 3 4 5 6; do
            echo "Attempt $attempt: Deploying opsera-backend to Cloud Run..."
            if gcloud run deploy opsera-backend \
              --project ${{ env.PROJECT_ID }} \
              --image docker.io/${{ env.DOCKER_USER }}/opsera-backend:${{ github.sha }} \
              --platform managed \
              --region ${{ env.REGION }} \
              --allow-unauthenticated \
              --port 8080 \
              --set-env-vars "ENVIRONMENT=production,DATABASE_URL=sqlite:////app/data/ops_agent.db,USE_MOCK_LLM_IN_DEV=true,STORAGE_BACKEND=local,LOCAL_STORAGE_DIR=/app/data/storage,AGENTIC_WORKER_URL=https://opsera-agentic-1030854563974.us-central1.run.app,CORS_ORIGINS=https://opsera-frontend-1030854563974.us-central1.run.app" \
              --memory 1Gi \
              --cpu 1 \
              --min-instances 0 \
              --max-instances 2; then
              echo "opsera-backend deployment succeeded!"
              break
            fi
            if [ $attempt -eq 6 ]; then
              echo "Deployment failed after 6 attempts."
              exit 1
            fi
            echo "Image propagation to mirror.gcr.io pending. Retrying in 12 seconds..."
            sleep 12
          done

          echo "Applying IAM invoker policy binding for public access..."
          gcloud run services add-iam-policy-binding opsera-backend \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --member="allUsers" \
            --role="roles/run.invoker" || true

  # --- 2. OPSERA AGENTIC WORKER SERVICE ---
  service-agentic:
    name: "Agentic Worker: Build & Deploy"
    needs: [backend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Build & Push Agentic Worker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./agentic/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_USER }}/opsera-agentic:${{ github.sha }}
            ${{ env.DOCKER_USER }}/opsera-agentic:latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GOOGLE_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy opsera-agentic to Cloud Run
        run: |
          sleep 10
          for attempt in 1 2 3 4 5 6; do
            echo "Attempt $attempt: Deploying opsera-agentic to Cloud Run..."
            if gcloud run deploy opsera-agentic \
              --project ${{ env.PROJECT_ID }} \
              --image docker.io/${{ env.DOCKER_USER }}/opsera-agentic:${{ github.sha }} \
              --platform managed \
              --region ${{ env.REGION }} \
              --allow-unauthenticated \
              --port 8080 \
              --set-env-vars "ENVIRONMENT=production,USE_MOCK_LLM_IN_DEV=true" \
              --memory 1Gi \
              --cpu 1 \
              --min-instances 0 \
              --max-instances 2; then
              echo "opsera-agentic deployment succeeded!"
              break
            fi
            if [ $attempt -eq 6 ]; then
              echo "Deployment failed after 6 attempts."
              exit 1
            fi
            echo "Image propagation to mirror.gcr.io pending. Retrying in 12 seconds..."
            sleep 12
          done

          echo "Applying IAM invoker policy binding for public access..."
          gcloud run services add-iam-policy-binding opsera-agentic \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --member="allUsers" \
            --role="roles/run.invoker" || true

  # --- 3. OPSERA FRONTEND SERVICE ---
  # Runs immediately in parallel (T=0)
  service-frontend:
    name: "Frontend: Build & Deploy"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_USER }}/opsera-frontend:${{ github.sha }}
            ${{ env.DOCKER_USER }}/opsera-frontend:latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GOOGLE_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Discover Backend URL & Deploy opsera-frontend
        run: |
          BACKEND_URL=$(gcloud run services describe opsera-backend --project ${{ env.PROJECT_ID }} --platform managed --region ${{ env.REGION }} --format 'value(status.url)' 2>/dev/null || true)
          if [ -z "$BACKEND_URL" ]; then
            BACKEND_URL="https://opsera-backend-1030854563974.us-central1.run.app"
          fi
          echo "Using Backend URL: $BACKEND_URL"

          sleep 10
          for attempt in 1 2 3 4 5 6; do
            echo "Attempt $attempt: Deploying opsera-frontend to Cloud Run..."
            if gcloud run deploy opsera-frontend \
              --project ${{ env.PROJECT_ID }} \
              --image docker.io/${{ env.DOCKER_USER }}/opsera-frontend:${{ github.sha }} \
              --platform managed \
              --region ${{ env.REGION }} \
              --allow-unauthenticated \
              --port 8080 \
              --set-env-vars "NODE_ENV=production,BACKEND_API_URL=${BACKEND_URL},NEXT_PUBLIC_API_URL=/api,AGENTIC_API_URL=https://opsera-agentic-1030854563974.us-central1.run.app" \
              --memory 512Mi \
              --cpu 1 \
              --min-instances 0 \
              --max-instances 2; then
              echo "opsera-frontend deployment succeeded!"
              break
            fi
            if [ $attempt -eq 6 ]; then
              echo "Deployment failed after 6 attempts."
              exit 1
            fi
            echo "Image propagation to mirror.gcr.io pending. Retrying in 12 seconds..."
            sleep 12
          done

          echo "Applying IAM invoker policy binding for public access..."
          gcloud run services add-iam-policy-binding opsera-frontend \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --member="allUsers" \
            --role="roles/run.invoker" || true

  # ==========================================
  # STAGE 3: Final Deployment Summary
  # ==========================================
  deployment-summary:
    name: Deployment Summary
    needs: [service-backend, service-agentic, service-frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GOOGLE_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Publish Summary Table
        run: |
          FRONTEND_URL=$(gcloud run services describe opsera-frontend --project ${{ env.PROJECT_ID }} --platform managed --region ${{ env.REGION }} --format 'value(status.url)' 2>/dev/null || echo "https://opsera-frontend-1030854563974.us-central1.run.app")
          BACKEND_URL=$(gcloud run services describe opsera-backend --project ${{ env.PROJECT_ID }} --platform managed --region ${{ env.REGION }} --format 'value(status.url)' 2>/dev/null || echo "https://opsera-backend-1030854563974.us-central1.run.app")
          AGENTIC_URL=$(gcloud run services describe opsera-agentic --project ${{ env.PROJECT_ID }} --platform managed --region ${{ env.REGION }} --format 'value(status.url)' 2>/dev/null || echo "https://opsera-agentic-1030854563974.us-central1.run.app")

          FRONT_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL" || echo "N/A")
          BACK_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/api/healthz" || echo "N/A")
          AGENT_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$AGENTIC_URL/healthz" || echo "N/A")

          echo "### 🚀 Cloud Run Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Cloud Run Endpoint | HTTP Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend UI** | [$FRONTEND_URL]($FRONTEND_URL) | HTTP $FRONT_CODE |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend API** | [$BACKEND_URL]($BACKEND_URL) | HTTP $BACK_CODE |" >> $GITHUB_STEP_SUMMARY
          echo "| **Agentic Worker** | [$AGENTIC_URL]($AGENTIC_URL) | HTTP $AGENT_CODE |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$FRONT_CODE" = "403" ]; then
            echo "> [!WARNING]" >> $GITHUB_STEP_SUMMARY
            echo "> **Public Access Note:** If HTTP 403 Forbidden is returned, GCP Organization Policy \`constraints/iam.allowedPolicyMemberDomains\` (Domain Restricted Sharing) is preventing unauthenticated access. Grant \`roles/run.invoker\` to \`allUsers\` in Google Cloud Console or allow public access in the Organization Policy." >> $GITHUB_STEP_SUMMARY
          fi
