name: CD - Build & Deploy to Google Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: us-central1

jobs:
  build-and-deploy:
    name: Build Docker Images & Deploy Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/opsera-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/opsera-backend:latest

      - name: Build & Push Agentic Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./agentic/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/opsera-agentic:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/opsera-agentic:latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/opsera-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/opsera-frontend:latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy opsera-backend \
            --image docker.io/${{ secrets.DOCKERHUB_USERNAME }}/opsera-backend:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8000 \
            --set-env-vars "ENVIRONMENT=production,DATABASE_URL=sqlite:////app/data/ops_agent.db,USE_MOCK_LLM_IN_DEV=true,STORAGE_BACKEND=local,LOCAL_STORAGE_DIR=/app/data/storage" \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2

      - name: Retrieve Backend URL
        run: |
          BACKEND_URL=$(gcloud run services describe opsera-backend --platform managed --region ${{ env.REGION }} --format 'value(status.url)')
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV
          echo "Discovered Backend URL: $BACKEND_URL"

      - name: Deploy Agentic Worker to Cloud Run
        run: |
          gcloud run deploy opsera-agentic \
            --image docker.io/${{ secrets.DOCKERHUB_USERNAME }}/opsera-agentic:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "ENVIRONMENT=production,USE_MOCK_LLM_IN_DEV=true" \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2

      - name: Retrieve Agentic Worker URL
        run: |
          AGENTIC_URL=$(gcloud run services describe opsera-agentic --platform managed --region ${{ env.REGION }} --format 'value(status.url)')
          echo "AGENTIC_URL=$AGENTIC_URL" >> $GITHUB_ENV
          echo "Discovered Agentic URL: $AGENTIC_URL"

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy opsera-frontend \
            --image docker.io/${{ secrets.DOCKERHUB_USERNAME }}/opsera-frontend:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "NODE_ENV=production,BACKEND_API_URL=${{ env.BACKEND_URL }}" \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2

      - name: Retrieve Frontend URL
        run: |
          FRONTEND_URL=$(gcloud run services describe opsera-frontend --platform managed --region ${{ env.REGION }} --format 'value(status.url)')
          echo "FRONTEND_URL=$FRONTEND_URL" >> $GITHUB_ENV
          echo "Discovered Frontend URL: $FRONTEND_URL"

      - name: Deployment Summary
        run: |
          echo "### 🚀 Cloud Run Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Cloud Run Endpoint | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend** | [${{ env.FRONTEND_URL }}](${{ env.FRONTEND_URL }}) | Next.js 14 Web Interface |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend** | [${{ env.BACKEND_URL }}](${{ env.BACKEND_URL }}) | FastAPI Core + SQLite Database |" >> $GITHUB_STEP_SUMMARY
          echo "| **Agentic Worker** | [${{ env.AGENTIC_URL }}](${{ env.AGENTIC_URL }}) | LangGraph Investigation Worker |" >> $GITHUB_STEP_SUMMARY
